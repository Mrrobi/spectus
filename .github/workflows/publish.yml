name: publish

# Trigger: tag push matching v*.*.*
# Set up PyPI Trusted Publisher first (no token needed):
#   https://pypi.org/manage/project/spectus/settings/publishing/
#     Owner:                Mrrobi
#     Repository name:      spectus
#     Workflow filename:    publish.yml
#     Environment name:     pypi
#
# Then to release:
#   1. Bump version in pyproject.toml (e.g. 0.1.0 -> 0.1.1)
#   2. git commit -am "Release 0.1.1"
#   3. git tag v0.1.1
#   4. git push origin main --tags
# Workflow builds + publishes + creates GitHub release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write       # needed for github release creation
  id-token: write       # needed for PyPI Trusted Publisher OIDC

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "Tag v$TAG does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest tests/unit -q --no-header

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  pypi-publish:
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spectus/${{ needs.guard.outputs.version }}/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No token: uses Trusted Publisher OIDC. Configure on PyPI first.

  github-release:
    needs: [guard, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.guard.outputs.version }}" \
            dist/spectus-${{ needs.guard.outputs.version }}-py3-none-any.whl \
            dist/spectus-${{ needs.guard.outputs.version }}.tar.gz \
            --title "spectus ${{ needs.guard.outputs.version }}" \
            --generate-notes
